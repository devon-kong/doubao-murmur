name: Windows Build

# Produces a runnable build for every push. The maintainer has no local Windows
# toolchain, so CI is both the compiler and the way test builds are delivered.

on:
  push:
    branches: ['**']
    paths:
      - 'windows/**'
      - '.github/workflows/windows-*.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-*.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: 0.0.0
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: Build and test (win-x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Unit tests
        run: >
          dotnet test windows/tests/DoubaoMurmur.Tests/DoubaoMurmur.Tests.csproj
          -c Release
          --logger "console;verbosity=normal"

      - name: Publish app
        run: >
          dotnet publish windows/src/DoubaoMurmur.App/DoubaoMurmur.App.csproj
          -c Release -r win-x64 -p:Platform=x64 -p:Version=${{ env.APP_VERSION }}
          -o publish/DoubaoMurmur

      - name: Publish diagnostics tool
        run: >
          dotnet publish windows/tools/DoubaoMurmur.Diag/DoubaoMurmur.Diag.csproj
          -c Release -r win-x64 --self-contained true -p:Version=${{ env.APP_VERSION }}
          -o publish/DoubaoMurmur.Diag

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc `
            "/DMyAppVersion=${env:APP_VERSION}" `
            "/DSourceDir=$pwd\publish\DoubaoMurmur" `
            "/DOutputDir=$pwd\dist" `
            "/DOutputName=Doubao-Murmur-Setup-dev" `
            windows\installer\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: DoubaoMurmur-win-x64
          path: publish/DoubaoMurmur
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DoubaoMurmur-installer-win-x64
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload diagnostics tool
        uses: actions/upload-artifact@v4
        with:
          name: DoubaoMurmur-diag-win-x64
          path: publish/DoubaoMurmur.Diag
          if-no-files-found: error
