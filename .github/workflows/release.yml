name: Release macOS App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Extract version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild -project doubao-murmur.xcodeproj \
            -scheme doubao-murmur \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION=YES \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Package app
        run: |
          APP_PATH="build/Build/Products/Release/Doubao Murmur.app"
          cd "$(dirname "$APP_PATH")"
          zip -r -y "Doubao-Murmur-${GITHUB_REF_NAME}.zip" "Doubao Murmur.app"
          echo "ARTIFACT_PATH=$(pwd)/Doubao-Murmur-${GITHUB_REF_NAME}.zip" >> "$GITHUB_ENV"

      - name: Package Mac mini mirror helper
        run: scripts/package-murmur-mirror.sh

      - name: Locate Mac mini mirror helper package
        run: |
          MIRROR_ARTIFACT_PATH="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name 'murmur-mirror-mac-mini-*.zip' -print -quit)"
          test -n "$MIRROR_ARTIFACT_PATH"
          echo "MIRROR_ARTIFACT_PATH=$MIRROR_ARTIFACT_PATH" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.ARTIFACT_PATH }}
            ${{ env.MIRROR_ARTIFACT_PATH }}
          prerelease: ${{ contains(github.ref_name, '-') }}
